<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Collection - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f1016; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        .movie-card { background: #161822; border-radius: 8px; overflow: hidden; border: 1px solid #222638; cursor: pointer; transition: transform 0.2s ease; }
        .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
        .movie-poster { width: 100%; height: 260px; object-fit: cover; }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: bold; margin: 0 0 6px 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 12px; color: #b3b3b3; display: flex; justify-content: space-between; }
        .rating { color: #f3ce13; font-weight: bold; }
    </style>
</head>
<body>

    <header style="display:flex; justify-content:space-between; align-items:center; padding: 15px 30px; background:#161822; border-bottom:1px solid #222638;">
        <div style="color:#e50914; font-weight:bold; font-size:20px;">FILMYZONE</div>
        <div>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px;">Home</a>
            <a href="admin.html" style="color:#e50914; text-decoration:none; font-weight:bold;">+ Admin Editor</a>
        </div>
    </header>

    <div class="container">
        <h2>All Movies</h2>
        <div id="moviesContainer" class="movie-grid">
            <!-- Movie cards will be loaded here dynamically -->
        </div>
    </div>

    <script>
        function loadMovies() {
            const container = document.getElementById('moviesContainer');
            const movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];

            if (movies.length === 0) {
                container.innerHTML = '<p style="color:#b3b3b3;">Koi movie post nahi hui hai.</p>';
                return;
            }

            container.innerHTML = movies.map((movie, index) => `
                <div class="movie-card" onclick="openMovieDetail(${index})">
                    <img src="${movie.poster}" class="movie-poster" alt="${movie.title}">
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.genre || 'Movie'}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${movie.rating || '8.0'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openMovieDetail(index) {
            // Selected movie ka index save karke detail page par redirect karenge
            localStorage.setItem('selected_movie_index', index);
            window.location.href = 'movie-detail.html';
        }

        window.onload = loadMovies;
    </script>
</body>
</html>
