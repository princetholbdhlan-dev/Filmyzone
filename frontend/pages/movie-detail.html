<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f1016; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; background: #161822; border-radius: 10px; border: 1px solid #222638; }
        .download-box { text-align: center; margin: 30px 0; padding: 20px; background: #0f1016; border-radius: 8px; border: 1px dashed #e50914; }
        .btn-download { display: inline-block; background: #e50914; color: #fff; padding: 14px 28px; border-radius: 6px; font-weight: bold; font-size: 16px; text-decoration: none; transition: background 0.2s; border: none; cursor: pointer; }
        .btn-download:hover { background: #b20710; }
        
        /* Social Share Buttons */
        .share-container { display: flex; justify-content: center; gap: 12px; margin-top: 15px; }
        .btn-share { padding: 8px 16px; border-radius: 5px; font-size: 13px; font-weight: bold; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-whatsapp { background: #25d366; }
        .btn-telegram { background: #0088cc; }

        .content-body { font-size: 15px; line-height: 1.7; color: #d1d5db; }
        .content-body h1, .content-body h2, .content-body h3, .content-body h4 { color: #fff; border-left: 3px solid #e50914; padding-left: 8px; margin-top: 20px; }

        /* Popup Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #161822;
            border: 1px solid #333a56;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
            margin-bottom: 15px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .timer-box {
            font-size: 16px;
            color: #ffc107;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-get-link {
            display: inline-block;
            background: #333a56;
            color: #b3b3b3;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            pointer-events: none;
            cursor: not-allowed;
            transition: all 0.3s;
        }
        .btn-get-link.active {
            background: #25d366;
            color: #fff;
            pointer-events: auto;
            cursor: pointer;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 22px;
            color: #b3b3b3;
            cursor: pointer;
        }
        .close-modal:hover { color: #fff; }
    </style>
</head>
<body>

    <header style="display:flex; justify-content:space-between; align-items:center; padding: 15px 30px; background:#161822; border-bottom:1px solid #222638;">
        <div style="color:#e50914; font-weight:bold; font-size:20px;">FILMYZONE</div>
        <div>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px;">Home</a>
            <a href="movies.html" style="color:#b3b3b3; text-decoration:none;">Movies</a>
        </div>
    </header>

    <div class="container">
        <div id="movieDetailContent"></div>

        <!-- Download & Share Section -->
        <div class="download-box">
            <h3 style="margin-top:0; color:#fff;">Download Links</h3>
            <p style="color:#b3b3b3; font-size:13px; margin-bottom:15px;">Click below to start the fast download process:</p>
            
            <button class="btn-download" onclick="startDownloadProcess()">
                <i class="fa-solid fa-download"></i> Fast Download (GoFile)
            </button>
            
            <div class="share-container">
                <a id="whatsappShare" href="#" target="_blank" class="btn-share btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> Share WhatsApp</a>
                <a id="telegramShare" href="#" target="_blank" class="btn-share btn-telegram"><i class="fa-brands fa-telegram"></i> Share Telegram</a>
            </div>
        </div>
    </div>

    <!-- YouTube Video & 30-Sec Countdown Modal Popup -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeDownloadModal()">&times;</span>
            <div class="modal-header"><i class="fa-brands fa-youtube" style="color:#e50914;"></i> Watch Video to Unlock Link</div>
            
            <div class="video-wrapper">
                <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="timer-box" id="timerBox">
                <i class="fa-solid fa-clock"></i> Please wait <span id="countdown">30</span> seconds...
            </div>

            <a id="finalDownloadLink" href="#" target="_blank" class="btn-get-link">
                <i class="fa-solid fa-lock"></i> Please Wait...
            </a>
        </div>
    </div>

    <script>
        let rawDownloadLink = "#";
        let movieYtInput = "";
        let countdownTimer = null;

        // Default Fallback YouTube ID agar koi link na bhara ho
        const DEFAULT_YOUTUBE_ID = "dQw4w9WgXcQ";

        function extractYoutubeId(urlOrId) {
            if (!urlOrId) return DEFAULT_YOUTUBE_ID;
            urlOrId = urlOrId.trim();
            // Agar seedha ID diya ho (jaise 11 characters ki string)
            if (urlOrId.length === 11 && !urlOrId.includes('/')) {
                return urlOrId;
            }
            // Agar YouTube URL diya ho
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : DEFAULT_YOUTUBE_ID;
        }

        function renderMovieDetail() {
            const index = localStorage.getItem('selected_movie_index');
            const source = localStorage.getItem('movie_source');
            let movie = null;

            if (source === 'local') {
                let movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];
                movie = movies[index];
                if (movie) {
                    movies[index].views = (movies[index].views || 0) + 1;
                    localStorage.setItem('filmyzone_movies', JSON.stringify(movies));
                }
            } else {
                const defaultMovies = [
                    { title: "Inception", link: "https://example.com/download/inception", description: "<h2>Inception (2010)</h2>" }
                ];
                movie = defaultMovies[index];
            }

            if (!movie) {
                document.getElementById('movieDetailContent').innerHTML = '<h3>Movie details not found.</h3>';
                return;
            }

            document.title = movie.title + " - FILMYZONE";
            document.getElementById('movieDetailContent').innerHTML = `<div class="content-body">${movie.description}</div>`;
            rawDownloadLink = movie.link || '#';
            movieYtInput = movie.ytLink || ''; // Har post ka apna YouTube link/ID

            const shareText = encodeURIComponent(`🔥 Download *${movie.title}* in HD quality on FILMYZONE!\n\nLink: ` + window.location.href);
            document.getElementById('whatsappShare').href = `https://api.whatsapp.com/send?text=${shareText}`;
            document.getElementById('telegramShare').href = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('Download ' + movie.title)}`;
        }

        function startDownloadProcess() {
            const modal = document.getElementById('downloadModal');
            const iframe = document.getElementById('ytPlayer');
            const countdownEl = document.getElementById('countdown');
            const timerBox = document.getElementById('timerBox');
            const finalBtn = document.getElementById('finalDownloadLink');

            // Specific movie ka YouTube ID extract karega
            const ytId = extractYoutubeId(movieYtInput);
            iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            
            modal.style.display = 'flex';
            
            let timeLeft = 30;
            countdownEl.textContent = timeLeft;
            timerBox.style.display = 'block';

            finalBtn.classList.remove('active');
            finalBtn.href = "#";
            finalBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Please Wait...`;

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timerBox.style.display = 'none';
                    
                    finalBtn.classList.add('active');
                    finalBtn.href = rawDownloadLink;
                    finalBtn.innerHTML = `<i class="fa-solid fa-file-arrow-down"></i> Get Movie Download Link`;
                }
            }, 1000);
        }

        function closeDownloadModal() {
            const modal = document.getElementById('downloadModal');
            const iframe = document.getElementById('ytPlayer');
            
            modal.style.display = 'none';
            iframe.src = "";
            clearInterval(countdownTimer);
        }

        window.onload = renderMovieDetail;
    </script>
</body>
</html>
