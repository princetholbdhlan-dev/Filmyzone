<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 600px; margin: 40px auto; padding: 30px; background: #161822; border-radius: 10px; border: 1px solid #222638; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #b3b3b3; font-weight: 600; }
        .form-control { width: 100%; background: #0f1016; border: 1px solid #333a56; padding: 12px; border-radius: 8px; color: white; outline: none; font-size: 14px; box-sizing: border-box; }
        .form-control:focus { border-color: #e50914; }
        .btn-submit { width: 100%; background: #e50914; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-submit:hover { background: #b20710; }
    </style>
</head>
<body>
    <header style="display:flex; justify-content:space-between; align-items:center; padding: 15px 30px; background:#161822; border-bottom:1px solid #222638;">
        <div style="color:#e50914; font-weight:bold; font-size:20px;"><i class="fa-solid fa-film"></i> FILMYZONE</div>
        <nav>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px;">Home</a>
            <a href="movies.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px;">Movies</a>
            <a href="genres.html" style="color:#b3b3b3; text-decoration:none;">Genres</a>
        </nav>
    </header>

    <div class="container">
        <h2>Contact / Request a Movie</h2>
        <p style="color: #b3b3b3; font-size: 13px; margin-bottom: 25px;">Aapko koi movie chahiye ya koi query hai? Humein message bhejein!</p>
        
        <form onsubmit="handleContactSubmit(event)">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="cName" class="form-control" placeholder="Enter your name..." required>
            </div>
            <div class="form-group">
                <label>Your Email</label>
                <input type="email" id="cEmail" class="form-control" placeholder="Enter your email..." required>
            </div>
            <div class="form-group">
                <label>Movie Name / Message</label>
                <textarea id="cMsg" class="form-control" rows="5" placeholder="Type movie name or feedback here..." required></textarea>
            </div>
            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
        </form>
    </div>

    <script>
        function handleContactSubmit(e) {
            e.preventDefault();
            alert('Aapka message safaltapoorvak bhej diya gaya hai! Hum jald hi aapse sampark karenge.');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
