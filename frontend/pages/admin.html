<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin Editor - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f1016; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Main Split Layout (~70% and ~30%) */
        .admin-wrapper { display: flex; min-height: calc(100vh - 60px); }
        .editor-container { flex: 7; padding: 25px; background: #161822; border-right: 1px solid #222638; display: flex; flex-direction: column; }
        .sidebar-container { flex: 3; padding: 25px; background: #161822; overflow-y: auto; }
        
        @media(max-width: 900px) {
            .admin-wrapper { flex-direction: column; }
        }

        /* Toolbar styling */
        .toolbar { display: flex; flex-wrap: wrap; gap: 6px; background: #0f1016; padding: 10px; border: 1px solid #333a56; border-radius: 8px 8px 0 0; align-items: center; }
        .toolbar button, .toolbar select, .toolbar label.toolbar-btn { background: #161822; color: #b3b3b3; border: 1px solid #333a56; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; outline: none; display: inline-flex; align-items: center; gap: 5px; }
        .toolbar button:hover, .toolbar select:hover, .toolbar label.toolbar-btn:hover { background: #e50914; color: white; border-color: #e50914; }

        /* Content Editable Area */
        .editor-box { flex: 1; min-height: 400px; background: #0f1016; border: 1px solid #333a56; border-top: none; border-radius: 0 0 8px 8px; padding: 15px; color: #fff; outline: none; font-size: 15px; line-height: 1.6; overflow-y: auto; }
        
        /* Side by Side Box styling inside editor */
        .side-box-container { display: flex; gap: 15px; align-items: flex-start; margin: 15px 0; background: #10121a; padding: 12px; border: 1px dashed #333a56; border-radius: 8px; }
        .side-box-img { flex: 1; min-width: 120px; max-width: 180px; }
        .side-box-img img { width: 100%; border-radius: 6px; display: block; }
        .side-box-text { flex: 2; outline: none; min-height: 120px; font-size: 14px; }

        /* Sidebar Form Controls */
        .form-control { width: 100%; background: #0f1016; border: 1px solid #333a56; padding: 10px; border-radius: 8px; color: white; outline: none; font-size: 14px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        .form-control:focus { border-color: #e50914; }
        label { color: #b3b3b3; font-size: 13px; font-weight: 600; display: block; margin-top: 10px; }
        
        .btn-publish { width: 100%; background: #e50914; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
        .btn-publish:hover { background: #b20710; }
        .preview-img { width: 90px; height: 120px; object-fit: cover; border-radius: 6px; margin-top: 5px; display: none; border: 1px solid #333a56; }
    </style>
</head>
<body>
    <!-- Header Navbar -->
    <header style="display:flex; justify-content:space-between; align-items:center; padding: 12px 25px; background:#161822; border-bottom:1px solid #222638;">
        <div class="logo" style="color:#e50914; font-weight:bold; font-size:18px;"><i class="fa-solid fa-blog"></i> FILMYZONE Studio</div>
        <div>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px; font-size:14px;">Home</a>
            <a href="movies.html" style="color:#b3b3b3; text-decoration:none; font-size:14px;">Movies</a>
        </div>
    </header>

    <!-- Main Split Layout Wrapper -->
    <div class="admin-wrapper">
        
        <!-- LEFT SIDE: ~70% Editor Workspace -->
        <div class="editor-container">
            <h2 style="font-size: 20px; margin-bottom: 15px; border-left: 4px solid #e50914; padding-left: 10px;">Movie Content & Screenshots Editor</h2>
            
            <input type="text" id="postTitle" class="form-control" placeholder="Enter Movie Title here..." style="font-size: 18px; padding: 12px; font-weight: bold;">

            <!-- Advanced Formatting Toolbar -->
            <div class="toolbar">
                <select onchange="formatDoc('formatBlock', this.value); this.selectedIndex=0;">
                    <option value="">Text Style / Heading</option>
                    <option value="p">Normal Paragraph</option>
                    <option value="h1">Heading 1</option>
                    <option value="h2">Heading 2</option>
                    <option value="h3">Heading 3</option>
                </select>

                <select onchange="changeTextSize(this.value); this.selectedIndex=0;">
                    <option value="">Text Size</option>
                    <option value="12px">12px</option>
                    <option value="16px">16px</option>
                    <option value="20px">20px</option>
                    <option value="24px">24px</option>
                </select>

                <button type="button" onclick="formatDoc('bold')"><i class="fa-solid fa-bold"></i></button>
                <button type="button" onclick="formatDoc('italic')"><i class="fa-solid fa-italic"></i></button>
                <button type="button" onclick="formatDoc('underline')"><i class="fa-solid fa-underline"></i></button>
                
                <!-- Normal Image Add -->
                <label class="toolbar-btn">
                    <i class="fa-solid fa-image"></i> Add Image
                    <input type="file" accept="image/*" style="display:none;" onchange="insertGalleryImage(event)">
                </label>

                <!-- NEW: Side-by-Side Image + Text Box Button -->
                <label class="toolbar-btn" style="background: #222638; border-color: #e50914;">
                    <i class="fa-solid fa-columns"></i> Image + Text Box
                    <input type="file" accept="image/*" style="display:none;" onchange="insertSideBox(event)">
                </label>
            </div>

            <!-- Editable Typing Box -->
            <div id="editorContent" class="editor-box" contenteditable="true" placeholder="Yahan movie ki details likhein. 'Image + Text Box' button se aap image ke right side perfectly text type kar sakte hain..."></div>
        </div>

        <!-- RIGHT SIDE: ~30% Sidebar Settings -->
        <div class="sidebar-container">
            <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff; border-bottom: 1px solid #333a56; padding-bottom: 8px;"><i class="fa-solid fa-gear"></i> Post Settings</h3>

            <label>Category / Genre Type</label>
            <select id="movieCategory" class="form-control">
                <option value="action">Action</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="drama">Drama</option>
                <option value="horror">Horror</option>
            </select>

            <label>IMDb Rating</label>
            <input type="text" id="movieRating" class="form-control" placeholder="e.g. 8.8">

            <label>Genre & Year Subtitle</label>
            <input type="text" id="movieGenre" class="form-control" placeholder="e.g. Action / Sci-Fi • 2026">

            <label>Main Poster (Gallery Upload)</label>
            <input type="file" class="form-control" accept="image/*" onchange="previewMainPoster(event)" style="padding: 6px;">
            <img id="posterPreview" class="preview-img" alt="Poster Preview">
            <input type="hidden" id="moviePosterBase64">

            <label>Download Link</label>
            <input type="url" id="movieLink" class="form-control" placeholder="https://drive.google.com/...">

            <button type="button" class="btn-publish" onclick="publishPost()"><i class="fa-solid fa-paper-plane"></i> Publish Post</button>
        </div>

    </div>

    <script>
        function formatDoc(cmd, value = null) {
            document.execCommand(cmd, false, value);
        }

        function changeTextSize(size) {
            if (!size) return;
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        // Normal Gallery Image
        function insertGalleryImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    const editor = document.getElementById('editorContent');
                    editor.focus();
                    const imgHtml = `<br><img src="${base64}" style="width: 50%; display: block; margin: 10px auto; border-radius: 6px;"><br>`;
                    document.execCommand('insertHTML', false, imgHtml);
                };
                reader.readAsDataURL(file);
            }
        }

        // NEW: Insert Side-by-Side Box (Image on Left, Editable Textarea on Right)
        function insertSideBox(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    const editor = document.getElementById('editorContent');
                    editor.focus();
                    
                    const sideBoxHtml = `
                        <div class="side-box-container">
                            <div class="side-box-img">
                                <img src="${base64}" alt="Movie Poster">
                            </div>
                            <div class="side-box-text" contenteditable="true">
                                <p><strong>Movie Name:</strong> </p>
                                <p><strong>Release Year:</strong> </p>
                                <p><strong>Genre:</strong> </p>
                            </div>
                        </div><p><br></p>
                    `;
                    document.execCommand('insertHTML', false, sideBoxHtml);
                };
                reader.readAsDataURL(file);
            }
        }

        function previewMainPoster(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    document.getElementById('moviePosterBase64').value = base64;
                    const preview = document.getElementById('posterPreview');
                    preview.src = base64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function publishPost() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('movieCategory').value;
            const rating = document.getElementById('movieRating').value;
            const genre = document.getElementById('movieGenre').value;
            const poster = document.getElementById('moviePosterBase64').value;
            const link = document.getElementById('movieLink').value;
            const description = document.getElementById('editorContent').innerHTML;

            if (!title || !poster || !link) {
                alert('Kripya Title, Main Poster aur Download Link zaroor bharein!');
                return;
            }

            const movieData = {
                title,
                category,
                rating: rating || '8.0',
                genre: genre || 'Movie • 2026',
                poster,
                link,
                description
            };

            let movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];
            movies.push(movieData);
            localStorage.setItem('filmyzone_movies', JSON.stringify(movies));

            alert('Movie post safaltapoorvak publish ho gayi hai!');
            window.location.href = 'movies.html';
        }
    </script>
</body>
</html>
