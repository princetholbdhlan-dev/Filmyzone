<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f1016; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Password Lock Overlay */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1016; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-box {
            background: #161822; padding: 30px; border-radius: 12px;
            border: 1px solid #333a56; width: 320px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .auth-box input {
            width: 100%; background: #0f1016; border: 1px solid #333a56;
            padding: 12px; border-radius: 8px; color: white; outline: none;
            font-size: 15px; margin-bottom: 15px; box-sizing: border-box;
        }
        .auth-box button {
            width: 100%; background: #e50914; color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
        }

        /* Top Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #161822; border-bottom: 1px solid #222638; }

        /* Views Container */
        .dashboard-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: none; }
        .editor-container-main { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: none; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #161822; border: 1px solid #222638; padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; }
        .stat-icon { font-size: 30px; color: #e50914; background: rgba(229, 9, 20, 0.1); padding: 15px; border-radius: 8px; }
        .stat-info h3 { margin: 0; font-size: 22px; color: #fff; }
        .stat-info p { margin: 5px 0 0; font-size: 13px; color: #b3b3b3; }

        /* Dashboard Actions */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .btn-new { background: #e50914; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; text-decoration: none; }
        .btn-new:hover { background: #b20710; }

        /* Posts Table */
        .posts-table-wrapper { background: #161822; border: 1px solid #222638; border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 15px 20px; border-bottom: 1px solid #222638; }
        th { color: #b3b3b3; font-weight: 600; background: #10121a; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge-published { background: rgba(0, 255, 128, 0.15); color: #00ff80; }
        .badge-draft { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .action-btns button { background: none; border: none; color: #b3b3b3; cursor: pointer; font-size: 15px; margin-right: 10px; }
        .action-btns button:hover { color: #e50914; }

        /* Editor Layout */
        .admin-flex { display: flex; gap: 25px; }
        .editor-main { flex: 7; background: #161822; padding: 20px; border-radius: 10px; border: 1px solid #222638; }
        .editor-sidebar { flex: 3; background: #161822; padding: 20px; border-radius: 10px; border: 1px solid #222638; height: fit-content; }
        @media(max-width: 900px) { .admin-flex { flex-direction: column; } }

        /* Editor Toolbars & Controls */
        .toolbar { display: flex; flex-wrap: wrap; gap: 6px; background: #0f1016; padding: 10px; border: 1px solid #333a56; border-radius: 8px 8px 0 0; align-items: center; }
        .toolbar button, .toolbar select, .toolbar label.toolbar-btn { background: #161822; color: #b3b3b3; border: 1px solid #333a56; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .toolbar button:hover { background: #e50914; color: white; }
        .editor-box { min-height: 350px; background: #0f1016; border: 1px solid #333a56; border-top: none; border-radius: 0 0 8px 8px; padding: 15px; color: #fff; outline: none; font-size: 15px; line-height: 1.6; }
        .form-control { width: 100%; background: #0f1016; border: 1px solid #333a56; padding: 10px; border-radius: 8px; color: white; outline: none; font-size: 14px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        label { color: #b3b3b3; font-size: 13px; font-weight: 600; display: block; margin-top: 10px; }
        .preview-img { width: 90px; height: 120px; object-fit: cover; border-radius: 6px; margin-top: 5px; display: none; border: 1px solid #333a56; }
    </style>
</head>
<body>

    <!-- Password Lock Overlay -->
    <div id="authOverlay">
        <div class="auth-box">
            <h3><i class="fa-solid fa-lock" style="color: #e50914;"></i> Admin Login</h3>
            <input type="password" id="adminPassInput" placeholder="Enter password (admin123)..." onkeydown="if(event.key === 'Enter') verifyPassword()">
            <button onclick="verifyPassword()">Unlock Dashboard</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px; display: none;">Galat password!</p>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo" style="color:#e50914; font-weight:bold; font-size:18px;"><i class="fa-solid fa-blog"></i> FILMYZONE Studio</div>
        <div>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px; font-size:14px;"><i class="fa-solid fa-globe"></i> Visit Site</a>
            <a href="#" onclick="logout()" style="color:#e50914; text-decoration:none; font-size:14px;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </header>

    <!-- VIEW 1: DASHBOARD HOME (Stats + Post List) -->
    <div class="dashboard-container" id="dashboardView">
        <div class="dashboard-header">
            <div>
                <h2 style="margin:0; font-size:22px;">Dashboard Overview</h2>
                <p style="color:#b3b3b3; font-size:13px; margin:5px 0 0;">Manage your movie posts, drafts and analytics.</p>
            </div>
            <button class="btn-new" onclick="openEditorForNew()"><i class="fa-solid fa-plus"></i> Add New Post</button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-film"></i></div>
                <div class="stat-info">
                    <h3 id="statTotalPosts">0</h3>
                    <p>Total Posts</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-eye"></i></div>
                <div class="stat-info">
                    <h3 id="statTotalViews">0</h3>
                    <p>Total Views</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <h3 id="statPublished">0</h3>
                    <p>Published</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-file-pen"></i></div>
                <div class="stat-info">
                    <h3 id="statDrafts">0</h3>
                    <p>Drafts</p>
                </div>
            </div>
        </div>

        <!-- Posts Table -->
        <div class="posts-table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Movie Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Views</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="postsTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- VIEW 2: EDITOR SECTION (Hidden by default, opens on + click) -->
    <div class="editor-container-main" id="editorView">
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <button onclick="backToDashboard()" style="background: #222638; color: #fff; border: 1px solid #333a56; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
            <h2 id="editorHeading" style="margin:0; font-size: 18px; color: #e50914;">Create New Post</h2>
        </div>

        <input type="hidden" id="editIndex" value="-1">

        <div class="admin-flex">
            <!-- Left Editor -->
            <div class="editor-main">
                <input type="text" id="postTitle" class="form-control" placeholder="Enter Movie Title..." style="font-size: 18px; padding: 12px; font-weight: bold;">
                
                <div class="toolbar">
                    <select onchange="formatDoc('formatBlock', this.value); this.selectedIndex=0;">
                        <option value="">Heading</option>
                        <option value="H1">H1</option>
                        <option value="H2">H2</option>
                        <option value="H3">H3</option>
                    </select>
                    <button type="button" onclick="formatDoc('bold')"><i class="fa-solid fa-bold"></i></button>
                    <button type="button" onclick="formatDoc('italic')"><i class="fa-solid fa-italic"></i></button>
                    <button type="button" onclick="formatDoc('underline')"><i class="fa-solid fa-underline"></i></button>
                </div>
                <div id="editorContent" class="editor-box" contenteditable="true" placeholder="Type movie details here..."></div>
            </div>

            <!-- Right Settings Sidebar -->
            <div class="editor-sidebar">
                <h3 style="font-size: 15px; margin-top:0; border-bottom: 1px solid #333a56; padding-bottom: 8px;"><i class="fa-solid fa-gear"></i> Settings</h3>

                <label>Post Status</label>
                <select id="postStatus" class="form-control">
                    <option value="published">Publish (Live)</option>
                    <option value="draft">Save as Draft</option>
                </select>

                <label>Category</label>
                <select id="movieCategory" class="form-control">
                    <option value="action">Action</option>
                    <option value="sci-fi">Sci-Fi</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                </select>

                <label>IMDb Rating</label>
                <input type="text" id="movieRating" class="form-control" value="8.8">

                <label>Genre & Year</label>
                <input type="text" id="movieGenre" class="form-control" value="Action • 2026">

                <label>Main Poster</label>
                <input type="file" class="form-control" accept="image/*" onchange="previewMainPoster(event)" style="padding: 5px;">
                <img id="posterPreview" class="preview-img" alt="Preview">
                <input type="hidden" id="moviePosterBase64">

                <label>Download Link</label>
                <input type="url" id="movieLink" class="form-control" placeholder="https://...">

                <button type="button" onclick="savePost()" style="width:100%; background:#e50914; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:15px;"><i class="fa-solid fa-save"></i> Save Post</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "200301";

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('filmyzone_admin_logged') === 'true') {
                unlockDashboard();
            }
        });

        function verifyPassword() {
            const inputVal = document.getElementById('adminPassInput').value;
            if (inputVal === ADMIN_PASSWORD) {
                sessionStorage.setItem('filmyzone_admin_logged', 'true');
                unlockDashboard();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function unlockDashboard() {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadDashboardData();
        }

        function logout() {
            sessionStorage.removeItem('filmyzone_admin_logged');
            location.reload();
        }

        function loadDashboardData() {
            const movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];
            const tbody = document.getElementById('postsTableBody');
            
            let totalViews = 0;
            let publishedCount = 0;
            let draftCount = 0;

            if (movies.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#b3b3b3;">No posts found. Click "+ Add New Post" to start.</td></tr>`;
            } else {
                tbody.innerHTML = movies.map((m, index) => {
                    const views = m.views || 0;
                    totalViews += views;
                    const status = m.status || 'published';
                    if (status === 'published') publishedCount++;
                    else draftCount++;

                    return `
                        <tr>
                            <td style="font-weight:600; color:#fff;">${m.title}</td>
                            <td style="text-transform:capitalize;">${m.category || 'action'}</td>
                            <td><span class="badge badge-${status}">${status}</span></td>
                            <td><i class="fa-solid fa-eye" style="color:#e50914; margin-right:5px;"></i> ${views}</td>
                            <td class="action-btns">
                                <button onclick="editPost(${index})" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deletePost(${index})" title="Delete" style="color:#ff4d4d;"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('statTotalPosts').textContent = movies.length;
            document.getElementById('statTotalViews').textContent = totalViews;
            document.getElementById('statPublished').textContent = publishedCount;
            document.getElementById('statDrafts').textContent = draftCount;
        }

        function openEditorForNew() {
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('editorView').style.display = 'block';
            document.getElementById('editorHeading').textContent = "Create New Post";
            document.getElementById('editIndex').value = -1;

            document.getElementById('postTitle').value = '';
            document.getElementById('editorContent').innerHTML = '';
            document.getElementById('movieRating').value = '8.8';
            document.getElementById('movieGenre').value = 'Action • 2026';
            document.getElementById('movieLink').value = '';
            document.getElementById('moviePosterBase64').value = '';
            document.getElementById('posterPreview').style.display = 'none';
            document.getElementById('postStatus').value = 'published';
        }

        function editPost(index) {
            const movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];
            const m = movies[index];
            if (!m) return;

            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('editorView').style.display = 'block';
            document.getElementById('editorHeading').textContent = "Edit Post";
            document.getElementById('editIndex').value = index;

            document.getElementById('postTitle').value = m.title;
            document.getElementById('editorContent').innerHTML = m.description || '';
            document.getElementById('movieCategory').value = m.category || 'action';
            document.getElementById('movieRating').value = m.rating || '8.8';
            document.getElementById('movieGenre').value = m.genre || '';
            document.getElementById('movieLink').value = m.link || '';
            document.getElementById('postStatus').value = m.status || 'published';
            
            if (m.poster) {
                document.getElementById('moviePosterBase64').value = m.poster;
                const prev = document.getElementById('posterPreview');
                prev.src = m.poster;
                prev.style.display = 'block';
            }
        }

        function backToDashboard() {
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadDashboardData();
        }

        function deletePost(index) {
            if (confirm('Kya aap is post ko delete karna chahte hain?')) {
                let movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];
                movies.splice(index, 1);
                localStorage.setItem('filmyzone_movies', JSON.stringify(movies));
                loadDashboardData();
            }
        }

        function previewMainPoster(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('moviePosterBase64').value = e.target.result;
                    const prev = document.getElementById('posterPreview');
                    prev.src = e.target.result;
                    prev.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function savePost() {
            const title = document.getElementById('postTitle').value;
            const description = document.getElementById('editorContent').innerHTML;
            const category = document.getElementById('movieCategory').value;
            const rating = document.getElementById('movieRating').value;
            const genre = document.getElementById('movieGenre').value;
            const poster = document.getElementById('moviePosterBase64').value;
            const link = document.getElementById('movieLink').value;
            const status = document.getElementById('postStatus').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!title || !link) {
                alert('Title aur Download Link zaroor bharein!');
                return;
            }

            let movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];

            if (editIndex >= 0) {
                // Update existing
                movies[editIndex] = {
                    ...movies[editIndex],
                    title, description, category, rating, genre, poster: poster || movies[editIndex].poster, link, status
                };
            } else {
                // Create new with initial views = 0
                const newPost = {
                    title, description, category, rating, genre, poster: poster || 'https://via.placeholder.com/250x350', link, status, views: 0
                };
                movies.push(newPost);
            }

            localStorage.setItem('filmyzone_movies', JSON.stringify(movies));
            alert('Post safaltapoorvak save ho gayi hai!');
            backToDashboard();
        }

        function formatDoc(cmd, val = null) {
            document.execCommand(cmd, false, val);
        }
    </script>
</body>
</html>
