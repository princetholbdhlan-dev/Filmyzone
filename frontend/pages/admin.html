<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Panel - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f1016; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Password Lock Overlay */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1016;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: #161822;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333a56;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .auth-box h3 { margin-bottom: 20px; color: #fff; font-size: 18px; }
        .auth-box input {
            width: 100%;
            background: #0f1016;
            border: 1px solid #333a56;
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .auth-box button {
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .auth-box button:hover { background: #b20710; }

        /* Main Split Layout (~70% and ~30%) */
        .admin-wrapper { display: flex; min-height: calc(100vh - 60px); display: none; }
        .editor-container { flex: 7; padding: 25px; background: #161822; border-right: 1px solid #222638; display: flex; flex-direction: column; }
        .sidebar-container { flex: 3; padding: 25px; background: #161822; overflow-y: auto; }
        
        @media(max-width: 900px) {
            .admin-wrapper { flex-direction: column; }
        }

        /* Toolbar styling */
        .toolbar { display: flex; flex-wrap: wrap; gap: 6px; background: #0f1016; padding: 10px; border: 1px solid #333a56; border-radius: 8px 8px 0 0; align-items: center; }
        .toolbar button, .toolbar select, .toolbar label.toolbar-btn { background: #161822; color: #b3b3b3; border: 1px solid #333a56; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; outline: none; display: inline-flex; align-items: center; gap: 5px; }
        .toolbar button:hover, .toolbar select:hover, .toolbar label.toolbar-btn:hover { background: #e50914; color: white; border-color: #e50914; }

        /* Content Editable Area & HTML Textarea */
        .editor-box { flex: 1; min-height: 400px; background: #0f1016; border: 1px solid #333a56; border-top: none; border-radius: 0 0 8px 8px; padding: 15px; color: #fff; outline: none; font-size: 15px; line-height: 1.6; overflow-y: auto; }
        .html-textarea { flex: 1; min-height: 400px; background: #0f1016; border: 1px solid #333a56; border-top: none; border-radius: 0 0 8px 8px; padding: 15px; color: #00ffcc; outline: none; font-size: 14px; font-family: monospace; line-height: 1.6; resize: vertical; display: none; box-sizing: border-box; width: 100%; }

        /* Image Wrapper with Built-in Size Controls */
        .img-wrapper { display: inline-block; margin: 15px 5px; text-align: center; vertical-align: top; max-width: 100%; }
        .img-wrapper img { width: 250px; border-radius: 6px; display: block; border: 2px solid #333a56; }
        .img-controls-bar { background: #222638; padding: 4px 8px; border-radius: 0 0 6px 6px; display: flex; gap: 4px; justify-content: center; border: 1px solid #333a56; border-top: none; }
        .img-controls-bar button { background: #161822; color: #fff; border: 1px solid #333a56; padding: 2px 6px; font-size: 11px; border-radius: 3px; cursor: pointer; }
        .img-controls-bar button:hover { background: #e50914; }

        /* Side by Side Box styling inside editor */
        .side-box-container { display: flex; gap: 15px; align-items: flex-start; margin: 15px 0; background: #10121a; padding: 12px; border: 1px dashed #333a56; border-radius: 8px; position: relative; }
        .side-box-img-area { flex: 1; min-width: 120px; max-width: 180px; text-align: center; }
        .side-box-img-area img { width: 100%; border-radius: 6px; display: block; border: 1px solid #333a56; }
        .side-box-text { flex: 2; outline: none; min-height: 120px; font-size: 14px; }

        /* Sidebar Form Controls */
        .form-control { width: 100%; background: #0f1016; border: 1px solid #333a56; padding: 10px; border-radius: 8px; color: white; outline: none; font-size: 14px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        .form-control:focus { border-color: #e50914; }
        label { color: #b3b3b3; font-size: 13px; font-weight: 600; display: block; margin-top: 10px; }
        
        .btn-publish { width: 100%; background: #e50914; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
        .btn-publish:hover { background: #b20710; }
        
        .btn-backup { width: 100%; background: #222638; color: #fff; border: 1px solid #333a56; padding: 10px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 8px; font-weight: 600; }
        .btn-backup:hover { background: #333a56; }

        .preview-img { width: 90px; height: 120px; object-fit: cover; border-radius: 6px; margin-top: 5px; display: none; border: 1px solid #333a56; }
    </style>
</head>
<body>

    <!-- Password Lock Screen Overlay -->
    <div id="authOverlay">
        <div class="auth-box">
            <h3><i class="fa-solid fa-lock" style="color: #e50914;"></i> Admin Login</h3>
            <input type="password" id="adminPassInput" placeholder="Enter admin password..." onkeydown="if(event.key === 'Enter') verifyPassword()">
            <button onclick="verifyPassword()">Unlock Panel</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px; display: none;">Galat password! Dubara koshish karein.</p>
        </div>
    </div>

    <!-- Header Navbar -->
    <header style="display:flex; justify-content:space-between; align-items:center; padding: 12px 25px; background:#161822; border-bottom:1px solid #222638;">
        <div class="logo" style="color:#e50914; font-weight:bold; font-size:18px;"><i class="fa-solid fa-blog"></i> FILMYZONE Studio</div>
        <div>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px; font-size:14px;">Home</a>
            <a href="movies.html" style="color:#b3b3b3; text-decoration:none; font-size:14px;">Movies</a>
        </div>
    </header>

    <!-- Main Split Layout Wrapper -->
    <div class="admin-wrapper" id="adminWrapper">
        
        <!-- LEFT SIDE: ~70% Editor Workspace -->
        <div class="editor-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 20px; margin: 0; border-left: 4px solid #e50914; padding-left: 10px;">Movie Content Editor</h2>
                <!-- Compose / HTML View Toggle Tabs -->
                <div style="display: flex; background: #0f1016; border: 1px solid #333a56; border-radius: 6px; overflow: hidden;">
                    <button type="button" id="tabCompose" onclick="switchView('compose')" style="background: #e50914; color: white; border: none; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 600;">Compose</button>
                    <button type="button" id="tabHtml" onclick="switchView('html')" style="background: transparent; color: #b3b3b3; border: none; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 600;">HTML</button>
                </div>
            </div>
            
            <input type="text" id="postTitle" class="form-control" placeholder="Enter Movie Title here..." style="font-size: 18px; padding: 12px; font-weight: bold;">

            <!-- Advanced Formatting Toolbar -->
            <div id="formattingToolbar" class="toolbar">
                <select onchange="applyHeading(this.value); this.selectedIndex=0;">
                    <option value="">Text Style / Heading</option>
                    <option value="p">Normal Paragraph</option>
                    <option value="H1">Heading 1 (Bada)</option>
                    <option value="H2">Heading 2 (Medium)</option>
                    <option value="H3">Heading 3 (Chhota)</option>
                </select>

                <select onchange="changeTextSize(this.value); this.selectedIndex=0;">
                    <option value="">Text Size</option>
                    <option value="12px">12px</option>
                    <option value="16px">16px</option>
                    <option value="20px">20px</option>
                    <option value="24px">24px</option>
                    <option value="30px">30px</option>
                </select>

                <button type="button" onclick="formatDoc('bold')"><i class="fa-solid fa-bold"></i></button>
                <button type="button" onclick="formatDoc('italic')"><i class="fa-solid fa-italic"></i></button>
                <button type="button" onclick="formatDoc('underline')"><i class="fa-solid fa-underline"></i></button>
                
                <button type="button" onclick="formatDoc('justifyLeft')" title="Align Left"><i class="fa-solid fa-align-left"></i></button>
                <button type="button" onclick="formatDoc('justifyCenter')" title="Align Center"><i class="fa-solid fa-align-center"></i></button>
                <button type="button" onclick="formatDoc('justifyRight')" title="Align Right"><i class="fa-solid fa-align-right"></i></button>

                <label class="toolbar-btn" onclick="saveCurrentSelection()">
                    <i class="fa-solid fa-image"></i> Add Image
                    <input type="file" accept="image/*" style="display:none;" onchange="insertGalleryImage(event)">
                </label>

                <label class="toolbar-btn" style="background: #222638; border-color: #e50914;" onclick="saveCurrentSelection()">
                    <i class="fa-solid fa-columns"></i> Image + Text Box
                    <input type="file" accept="image/*" style="display:none;" onchange="insertSideBox(event)">
                </label>
            </div>

            <!-- Editable Typing Box (Compose View) -->
            <div id="editorContent" class="editor-box" contenteditable="true" placeholder="Yahan movie ki details likhein..." onmouseup="saveCurrentSelection()" onkeyup="saveCurrentSelection()"></div>
            
            <!-- Raw HTML Code Editor (HTML View) -->
            <textarea id="htmlEditor" class="html-textarea" placeholder="HTML code yahan dikhega aur aap edit kar sakte hain..."></textarea>
        </div>

        <!-- RIGHT SIDE: ~30% Sidebar Settings -->
        <div class="sidebar-container">
            <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff; border-bottom: 1px solid #333a56; padding-bottom: 8px;"><i class="fa-solid fa-gear"></i> Post Settings</h3>

            <label>Category / Genre Type</label>
            <select id="movieCategory" class="form-control">
                <option value="action">Action</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="drama">Drama</option>
                <option value="horror">Horror</option>
            </select>

            <label>IMDb Rating</label>
            <input type="text" id="movieRating" class="form-control" placeholder="e.g. 8.8">

            <label>Genre & Year Subtitle</label>
            <input type="text" id="movieGenre" class="form-control" placeholder="e.g. Action / Sci-Fi • 2026">

            <label>Main Poster (Gallery Upload)</label>
            <input type="file" class="form-control" accept="image/*" onchange="previewMainPoster(event)" style="padding: 6px;">
            <img id="posterPreview" class="preview-img" alt="Poster Preview">
            <input type="hidden" id="moviePosterBase64">

            <label>Download Link</label>
            <input type="url" id="movieLink" class="form-control" placeholder="https://drive.google.com/...">

            <button type="button" class="btn-publish" onclick="publishPost()"><i class="fa-solid fa-paper-plane"></i> Publish Post</button>

            <!-- Data Backup & Recovery Section -->
            <hr style="border-color: #333a56; margin: 20px 0;">
            <h4 style="font-size: 14px; color: #b3b3b3; margin-bottom: 10px;"><i class="fa-solid fa-database"></i> Data Backup & Recovery</h4>
            <button type="button" class="btn-backup" onclick="exportBackup()"><i class="fa-solid fa-download"></i> Export Backup (JSON)</button>
            <button type="button" class="btn-backup" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> Import Backup</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
        </div>

    </div>

    <script>
        // --- PASSWORD PROTECTION CHECK ---
        const ADMIN_PASSWORD = "200301"; // Aap yahan apna password change kar sakte hain

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('filmyzone_admin_logged') === 'true') {
                unlockAdminPanel();
            }
        });

        function verifyPassword() {
            const inputVal = document.getElementById('adminPassInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputVal === ADMIN_PASSWORD) {
                sessionStorage.setItem('filmyzone_admin_logged', 'true');
                unlockAdminPanel();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function unlockAdminPanel() {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('adminWrapper').style.display = 'flex';
        }

        // --- EDITOR LOGIC ---
        let savedRange = null;
        let currentView = 'compose';

        function switchView(view) {
            const editor = document.getElementById('editorContent');
            const htmlArea = document.getElementById('htmlEditor');
            const toolbar = document.getElementById('formattingToolbar');
            const tabCompose = document.getElementById('tabCompose');
            const tabHtml = document.getElementById('tabHtml');

            if (view === 'html') {
                htmlArea.value = editor.innerHTML;
                editor.style.display = 'none';
                htmlArea.style.display = 'block';
                toolbar.style.display = 'none';
                
                tabHtml.style.background = '#e50914';
                tabHtml.style.color = '#fff';
                tabCompose.style.background = 'transparent';
                tabCompose.style.color = '#b3b3b3';
                currentView = 'html';
            } else {
                editor.innerHTML = htmlArea.value;
                htmlArea.style.display = 'none';
                editor.style.display = 'block';
                toolbar.style.display = 'flex';
                
                tabCompose.style.background = '#e50914';
                tabCompose.style.color = '#fff';
                tabHtml.style.background = 'transparent';
                tabHtml.style.color = '#b3b3b3';
                currentView = 'compose';
            }
        }

        function saveCurrentSelection() {
            if (currentView !== 'compose') return;
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                if (document.getElementById('editorContent').contains(range.commonAncestorContainer)) {
                    savedRange = range;
                }
            }
        }

        function restoreSelectionAndInsert(htmlString) {
            const editor = document.getElementById('editorContent');
            editor.focus();
            const selection = window.getSelection();
            
            if (savedRange) {
                selection.removeAllRanges();
                selection.addRange(savedRange);
            } else {
                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            if (document.queryCommandSupported('insertHTML')) {
                document.execCommand('insertHTML', false, htmlString);
            } else {
                const range = selection.getRangeAt(0);
                const el = document.createElement('div');
                el.innerHTML = htmlString;
                const frag = document.createDocumentFragment();
                let node;
                while ((node = el.firstChild)) {
                    frag.appendChild(node);
                }
                range.deleteContents();
                range.insertNode(frag);
            }
            saveCurrentSelection();
        }

        function formatDoc(cmd, value = null) {
            document.execCommand(cmd, false, value);
        }

        function applyHeading(tag) {
            if (!tag) return;
            document.execCommand('formatBlock', false, '<' + tag + '>');
        }

        function changeTextSize(size) {
            if (!size) return;
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = size;
            try {
                span.appendChild(range.extractContents());
                range.insertNode(span);
                selection.removeAllRanges();
                selection.addRange(range);
            } catch(e) {
                document.execCommand('fontSize', false, '4');
            }
        }

        function insertGalleryImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    const wrapperHtml = `
                        <div class="img-wrapper" contenteditable="false">
                            <img src="${base64}" alt="Image">
                            <div class="img-controls-bar">
                                <button type="button" onclick="changeImgSize(this, '150px')">Small</button>
                                <button type="button" onclick="changeImgSize(this, '280px')">Med</button>
                                <button type="button" onclick="changeImgSize(this, '100%')">Full</button>
                                <button type="button" onclick="this.closest('.img-wrapper').remove()" style="color:#ff4d4d;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div><p><br></p>
                    `;
                    restoreSelectionAndInsert(wrapperHtml);
                };
                reader.readAsDataURL(file);
            }
        }

        function changeImgSize(btn, widthVal) {
            const wrapper = btn.closest('.img-wrapper');
            const img = wrapper.querySelector('img');
            if(widthVal === '100%') {
                img.style.width = '100%';
            } else {
                img.style.width = widthVal;
            }
        }

        function insertSideBox(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    const sideBoxHtml = `
                        <div class="side-box-container" contenteditable="false">
                            <div class="side-box-img-area">
                                <img src="${base64}" alt="Movie Poster" style="width: 130px;">
                                <div class="img-controls-bar">
                                    <button type="button" onclick="changeSideBoxImgSize(this, '90px')">S</button>
                                    <button type="button" onclick="changeSideBoxImgSize(this, '130px')">M</button>
                                    <button type="button" onclick="changeSideBoxImgSize(this, '100%')">Full</button>
                                </div>
                            </div>
                            <div class="side-box-text" contenteditable="true">
                                <p><strong>Movie Name:</strong> </p>
                                <p><strong>Release Year:</strong> </p>
                                <p><strong>Genre:</strong> </p>
                            </div>
                            <button type="button" onclick="this.closest('.side-box-container').remove()" style="position: absolute; top: 8px; right: 8px; background: #e50914; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 11px;"><i class="fa-solid fa-trash"></i></button>
                        </div><p><br></p>
                    `;
                    restoreSelectionAndInsert(sideBoxHtml);
                };
                reader.readAsDataURL(file);
            }
        }

        function changeSideBoxImgSize(btn, widthVal) {
            const container = btn.closest('.side-box-img-area');
            const img = container.querySelector('img');
            img.style.width = widthVal;
        }

        function previewMainPoster(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    document.getElementById('moviePosterBase64').value = base64;
                    const preview = document.getElementById('posterPreview');
                    preview.src = base64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function publishPost() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('movieCategory').value;
            const rating = document.getElementById('movieRating').value;
            const genre = document.getElementById('movieGenre').value;
            const poster = document.getElementById('moviePosterBase64').value;
            const link = document.getElementById('movieLink').value;
            
            const description = currentView === 'html' 
                ? document.getElementById('htmlEditor').value 
                : document.getElementById('editorContent').innerHTML;

            if (!title || !poster || !link) {
                alert('Kripya Title, Main Poster aur Download Link zaroor bharein!');
                return;
            }

            const movieData = {
                title,
                category,
                rating: rating || '8.0',
                genre: genre || 'Movie • 2026',
                poster,
                link,
                description
            };

            let movies = JSON.parse(localStorage.getItem('filmyzone_movies')) || [];
            movies.push(movieData);
            localStorage.setItem('filmyzone_movies', JSON.stringify(movies));

            alert('Movie post safaltapoorvak publish ho gayi hai!');
            window.location.href = '../index.html';
        }

        // Export Backup JSON
        function exportBackup() {
            const data = localStorage.getItem('filmyzone_movies') || '[]';
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'filmyzone_backup.json';
            a.click();
        }

        // Import Backup JSON
        function importBackup(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        JSON.parse(e.target.result);
                        localStorage.setItem('filmyzone_movies', e.target.result);
                        alert('Backup successfully restore ho gaya hai!');
                        location.reload();
                    } catch (err) {
                        alert('Invalid JSON backup file!');
                    }
                };
                reader.readAsText(file);
            }
        }
    </script>
</body>
</html>
