<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogger Style Editor - FILMYZONE Admin</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f1016; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-layout { display: flex; height: calc(100vh - 60px); flex-direction: row; }
        @media(max-width: 768px) { .admin-layout { flex-direction: column; height: auto; } }
        
        /* Main Editor Section */
        .editor-main { flex: 3; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #222638; background: #161822; }
        .post-title-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #333a56; font-size: 24px; color: white; padding: 10px 0; outline: none; margin-bottom: 15px; font-weight: bold; }
        
        /* Toolbar */
        .editor-toolbar { display: flex; flex-wrap: wrap; gap: 8px; background: #0f1016; padding: 10px; border-radius: 8px 8px 0 0; border: 1px solid #333a56; border-bottom: none; }
        .toolbar-btn { background: #161822; color: #b3b3b3; border: 1px solid #333a56; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .toolbar-btn:hover { background: #e50914; color: white; border-color: #e50914; }

        /* Content Editable Area */
        .editor-textarea { flex: 1; min-height: 350px; background: #0f1016; border: 1px solid #333a56; border-radius: 0 0 8px 8px; padding: 15px; color: #fff; outline: none; overflow-y: auto; font-size: 15px; line-height: 1.6; }
        
        /* Sidebar Settings */
        .editor-sidebar { flex: 1; background: #161822; padding: 20px; overflow-y: auto; border-left: 1px solid #222638; }
        .sidebar-section { margin-bottom: 20px; border-bottom: 1px solid #222638; padding-bottom: 15px; }
        .sidebar-section h3 { font-size: 15px; margin-bottom: 10px; color: #e50914; display: flex; align-items: center; gap: 8px; }
        .form-control { width: 100%; background: #0f1016; border: 1px solid #333a56; padding: 10px; border-radius: 6px; color: white; outline: none; font-size: 13px; margin-top: 5px; margin-bottom: 12px; }
        .form-control:focus { border-color: #e50914; }
        
        .publish-top-btn { background: #e50914; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .publish-top-btn:hover { background: #b20710; }
    </style>
</head>
