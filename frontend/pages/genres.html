<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genres - FILMYZONE</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .genre-box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .genre-box { background: #161822; border: 1px solid #333a56; padding: 30px; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .genre-box:hover { border-color: #e50914; background: #222638; transform: translateY(-5px); }
        .genre-box i { font-size: 35px; color: #e50914; margin-bottom: 12px; }
        .genre-box h3 { margin: 0; font-size: 18px; color: #fff; }
    </style>
</head>
<body>
    <header style="display:flex; justify-content:space-between; align-items:center; padding: 15px 30px; background:#161822; border-bottom:1px solid #222638;">
        <div style="color:#e50914; font-weight:bold; font-size:20px;"><i class="fa-solid fa-film"></i> FILMYZONE</div>
        <nav>
            <a href="../index.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px;">Home</a>
            <a href="movies.html" style="color:#b3b3b3; text-decoration:none; margin-right:15px;">Movies</a>
            <a href="contact.html" style="color:#b3b3b3; text-decoration:none;">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Explore Movie Genres</h2>
        <div class="genre-box-grid">
            <div class="genre-box" onclick="goToCategory('action')">
                <i class="fa-solid fa-fire"></i>
                <h3>Action Movies</h3>
            </div>
            <div class="genre-box" onclick="goToCategory('sci-fi')">
                <i class="fa-solid fa-rocket"></i>
                <h3>Sci-Fi & Space</h3>
            </div>
            <div class="genre-box" onclick="goToCategory('drama')">
                <i class="fa-solid fa-masks-theater"></i>
                <h3>Drama & Thriller</h3>
            </div>
            <div class="genre-box" onclick="goToCategory('horror')">
                <i class="fa-solid fa-ghost"></i>
                <h3>Horror & Mystery</h3>
            </div>
        </div>
    </div>

    <script>
        function goToCategory(genre) {
            localStorage.setItem('selected_genre', genre);
            window.location.href = 'movies.html';
        }
    </script>
</body>
</html>
